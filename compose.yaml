services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
  localstack:
    image: localstack/localstack:4.10.0
    profiles: ["aws"]
    environment:
      SERVICES: dynamodb
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
